# Railway terminates TLS at its edge and adds no HSTS of its own, and phpMyAdmin
# sets X-Frame-Options, Referrer-Policy and CSP but never HSTS. `unset` first so a
# response that already carries one does not end up with two.
<IfModule mod_headers.c>
    Header unset Strict-Transport-Security
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
</IfModule>

# Health check. An Alias serves the file directly, where a /healthz directory would
# earn a mod_dir 301 to /healthz/ — which Apache builds as http://host:$PORT/... and
# the platform prober does not follow.
<IfModule mod_alias.c>
    Alias /healthz /var/www/html/railway-healthz.php
</IfModule>

<Files "railway-healthz.php">
    Require all granted
</Files>
